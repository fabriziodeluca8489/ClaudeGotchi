<!doctype html><html><head><meta charset="utf-8"><title>Colors</title><link rel="stylesheet" href="../../../styles.css"><style>body{height:auto;min-height:100vh}</style>
<style>.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.sw div{border-radius:12px;border:1px solid var(--line);overflow:hidden;font-size:11px}.sw i{display:block;height:44px}.sw p{margin:0;padding:6px 8px;color:var(--mut)}</style></head><body>
<div class="grp"><b>SUPERFICI E TESTO</b><div class="sw">
<div><i style="background:var(--bg)"></i><p>--bg</p></div><div><i style="background:var(--bg-glow-1)"></i><p>--bg-glow-1</p></div><div><i style="background:var(--bg-glow-2)"></i><p>--bg-glow-2</p></div><div><i style="background:var(--panel)"></i><p>--panel</p></div><div><i style="background:var(--chip)"></i><p>--chip</p></div><div><i style="background:var(--surface-2)"></i><p>--surface-2</p></div><div><i style="background:var(--text)"></i><p>--text</p></div><div><i style="background:var(--mut)"></i><p>--mut</p></div><div><i style="background:var(--acc)"></i><p>--acc</p></div><div><i style="background:var(--acc-soft)"></i><p>--acc-soft</p></div>
</div></div>
<div class="grp"><b>STATI</b><div class="sw">
<div><i style="background:var(--st-idle)"></i><p>--st-idle</p></div><div><i style="background:var(--st-working)"></i><p>--st-working</p></div><div><i style="background:var(--st-waiting)"></i><p>--st-waiting</p></div><div><i style="background:var(--st-done)"></i><p>--st-done</p></div><div><i style="background:var(--st-error)"></i><p>--st-error</p></div><div><i style="background:var(--st-off)"></i><p>--st-off</p></div>
</div></div>
<div class="grp"><b>LIMITI 5H / 7D</b><div class="sw">
<div><i style="background:var(--lim-ok)"></i><p>--lim-ok</p></div><div><i style="background:var(--lim-warn)"></i><p>--lim-warn</p></div><div><i style="background:var(--lim-bad)"></i><p>--lim-bad</p></div>
</div></div></body></html>
