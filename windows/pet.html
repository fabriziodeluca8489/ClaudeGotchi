<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; user-select: none; font-family: 'Segoe UI', sans-serif; }
  #root { width: 120px; height: 150px; box-sizing: border-box; padding: 8px; border-radius: 18px;
          display: flex; flex-direction: column; align-items: center; gap: 4px; color: #888; }
  #sprite { width: 96px; height: 96px; }
  /* pillola di stato: stesso stile del riquadro stats, pallino col colore dello stato */
  #info { max-width: 100%; box-sizing: border-box; padding: 3px 8px 3px 6px; border-radius: 99px; display: none;
          background: rgba(16,14,23,.82); box-shadow: 0 2px 6px rgba(0,0,0,.35); color: #e8e6f0;
          font-size: 10px; font-weight: 600; line-height: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #info i { display: inline-block; width: 6px; height: 6px; margin-right: 5px; border-radius: 50%; vertical-align: 1px;
            background: var(--c); box-shadow: 0 0 5px var(--c); }
  #info.working i { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  /* spazio sotto lo sprite: ~36px, quindi righe compatte e barra dentro la riga */
  #stats { width: 100%; box-sizing: border-box; margin-top: -2px; padding: 2px 6px; border-radius: 8px; display: none;
           background: rgba(16,14,23,.82); box-shadow: 0 2px 6px rgba(0,0,0,.35); color: #e8e6f0;
           font: 9px Consolas, monospace; animation: pop .15s ease-out; }
  #stats .row { display: flex; align-items: baseline; gap: 4px; line-height: 10px; padding-bottom: 1px;
                background: no-repeat 0 100% / var(--p, 0) 1px var(--c, transparent); }
  #stats .k { width: 20px; color: #9a96a8; text-transform: uppercase; font-size: 8px; }
  #stats .v { font-weight: 700; }
  #stats .r { margin-left: auto; color: #9a96a8; }
  @keyframes pop { from { opacity: 0; transform: translateY(3px); } }
  .celebrate #sprite { animation: jump .5s ease-in-out 3, flash .3s 4; }
  @keyframes jump { 50% { transform: translateY(-14px); } }
  @keyframes flash { 50% { filter: brightness(1.6); } }
</style></head>
<body>
<div id="root"><div id="sprite"></div><div id="info"></div><div id="stats"></div></div>
<script src="shared.js"></script><script src="sprite.js"></script>
<script>
let S, ST, RATE, catalog, hovering = false, prevState = 'idle';
const root = document.getElementById('root'), sp = new SpriteEl(document.getElementById('sprite'));

function caption() {
  switch (ST.state) {
    case 'idle': return 'in attesa';
    case 'working': return !ST.tool || !S.info.includes('tool') ? 'al lavoro…' : ST.tool;
    case 'waiting': return 'tocca a te ✋';
    case 'done': return 'fatto! 🎉';
    default: return 'ops…';
  }
}

function render() {
  if (!S || !ST) return;
  const sc = CG.sizeOf(S).scale;
  document.body.style.zoom = sc;
  const a = CG.activityFrom(ST, Date.now(), S.sleepMinutes * 60000);
  sp.set(CG.sheetFor(S, catalog, a), CG.fpsFor(S, a));
  // Sfondo: quasi trasparente (alpha 0.01) resta cliccabile e trascinabile.
  const bg = S.bgColor === 'stato' ? CG.TINT[ST.state] : CG.BGS.find((b) => b.id === S.bgColor).color;
  root.style.background = S.bgTransparent ? 'rgba(0,0,0,0.01)' : bg;
  const rows = CG.statRows(ST, RATE, S.info);
  const stats = document.getElementById('stats'), info = document.getElementById('info');
  const showStats = S.showStats && rows.length && (hovering || S.statsAlways);
  stats.style.display = showStats ? 'block' : 'none';
  stats.innerHTML = rows.map(([k, v, r]) => {
    // i limiti (5h/7d) hanno una percentuale numerica: mostra anche la barra
    const pct = /^(5h|7d)$/.test(k) && /^\d+(\.\d+)?$/.test(v) ? Math.min(Math.round(v), 100) : null;
    const c = pct >= 90 ? '#f85149' : pct >= 70 ? '#e3b341' : '#7ee787';
    const bar = pct === null ? '' : ` style="--p:${pct}%;--c:linear-gradient(${c},${c})"`;
    return `<div class="row"${bar}><span class="k">${k}</span><span class="v">${pct === null ? v : pct + '%'}</span><span class="r">${r}</span></div>`;
  }).join('');
  info.style.display = !showStats && S.info.includes('caption') ? 'block' : 'none';
  info.className = ST.state;
  info.style.setProperty('--c', CG.TINT[ST.state] || CG.TINT.error);
  info.innerHTML = '<i></i>';
  info.append(caption()); // testo del tool come nodo di testo, non HTML
}

function onState(st) {
  if (st.state === 'done' && prevState !== 'done') {
    root.classList.add('celebrate'); cg.beep();
    setTimeout(() => root.classList.remove('celebrate'), 1600);
  }
  prevState = st.state; ST = st; render();
}

cg.init().then((i) => { S = i.settings; ST = i.state; RATE = i.rate; catalog = i.catalog; render(); });
cg.onSettings((s) => { S = s; render(); });
cg.onState(onState);
cg.onRate((r) => { RATE = r; render(); });
setInterval(render, 30000); // idle -> dorme

document.addEventListener('mouseenter', () => { hovering = true; render(); });
document.addEventListener('mouseleave', () => { hovering = false; render(); });
document.addEventListener('contextmenu', (e) => { e.preventDefault(); cg.menu(); });
let down = false;
document.addEventListener('mousedown', (e) => { if (e.button === 0) { down = true; cg.dragStart(e.screenX, e.screenY); } });
document.addEventListener('mousemove', (e) => { if (down) cg.dragMove(e.screenX, e.screenY); });
document.addEventListener('mouseup', () => (down = false));
</script></body></html>
